name: Android CI

# The paths below cannot change what Gradle builds, so a commit touching only those skips a
# seven-minute Android build. This is a denylist rather than an allowlist on purpose: a path
# nobody anticipated still runs this workflow, which is the safe direction to be wrong in.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
      - "CITATION.cff"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
      - "CITATION.cff"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_PLATFORM_PACKAGE: platforms;android-37.0
      ANDROID_BUILD_TOOLS_PACKAGE: build-tools;37.0.0

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Protocol v1 and collector contracts
        run: |
          python3 tools/catalog.py check
          python3 tools/catalog_parity.py
          python3 tools/validate_protocol_vectors.py
          python3 tools/retired_identity_audit.py
          python3 -m unittest discover -s tools/tests -v

      # The wrapper JAR is a binary in the tree; this checks it against Gradle's published
      # checksums so nobody has to take it on faith.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # The runner image ships the SDK but does not put cmdline-tools on PATH, and the
          # directory under cmdline-tools is not always named "latest". Resolve it rather than
          # assume either, and fail loudly instead of building against whatever happens to exist.
          sdkmanager=""
          for candidate in "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
                           "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
                           "$ANDROID_SDK_ROOT"/tools/bin/sdkmanager; do
            if [[ -x "$candidate" ]]; then
              sdkmanager="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager" ]]; then
            echo "No sdkmanager under $ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          "$sdkmanager" "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE"
          dirname "$sdkmanager" >> "$GITHUB_PATH"

      - name: Test, lint, and build
        run: >-
          ./gradlew --no-daemon
          test testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Consume shared Protocol v1 vectors in Kotlin
        run: >-
          ./gradlew --no-daemon
          -I tools/protocol-conformance.init.gradle
          :core:export:test
          --tests particeps.conformance.ProtocolConformanceTest

      - name: Enforce collector capability boundary
        run: python3 tools/collector_assurance.py

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: particeps-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented:
    name: Instrumented tests (API 34)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests on the minimum supported Android version
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 37
          system-image-api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
