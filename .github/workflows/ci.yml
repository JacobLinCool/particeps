name: Android CI

# The paths below cannot change what Gradle builds, so a commit touching only those skips a
# seven-minute Android build. This is a denylist rather than an allowlist on purpose: a path
# nobody anticipated still runs this workflow, which is the safe direction to be wrong in.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
      - "CITATION.cff"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
      - "CITATION.cff"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_PLATFORM_PACKAGE: platforms;android-37.0
      ANDROID_BUILD_TOOLS_PACKAGE: build-tools;37.0.0
      ANDROID_NDK_PACKAGE: ndk;30.0.14904198
      PARTICEPS_KOTLIN_EXPORT_INTEROP_DIR: ${{ github.workspace }}/build/protocol-interop/kotlin-export
      PARTICEPS_REGISTRY_MERGE_BASE: ${{ github.event.pull_request.base.sha || '' }}
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ""
      GONOPROXY: ""
      GONOSUMDB: ""
      GOVCS: "*:off"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the declared pull-request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PARTICEPS_REGISTRY_MERGE_BASE"
          git fetch --no-tags origin "$PARTICEPS_REGISTRY_MERGE_BASE"
          git cat-file -e "$PARTICEPS_REGISTRY_MERGE_BASE^{commit}"

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: native/traffic-shaping/go.sum

      - name: Validate Protocol v1 and collector contracts
        run: |
          python3 tools/event_source_registry.py check
          python3 -m unittest tools.tests.test_event_source_registry
          python3 tools/validate_protocol_vectors.py
          python3 tools/retired_identity_audit.py
          python3 -m unittest discover -s tools/tests -v

      # The wrapper JAR is a binary in the tree; this checks it against Gradle's published
      # checksums so nobody has to take it on faith.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # The runner image ships the SDK but does not put cmdline-tools on PATH, and the
          # directory under cmdline-tools is not always named "latest". Resolve it rather than
          # assume either, and fail loudly instead of building against whatever happens to exist.
          sdkmanager=""
          for candidate in "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
                           "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
                           "$ANDROID_SDK_ROOT"/tools/bin/sdkmanager; do
            if [[ -x "$candidate" ]]; then
              sdkmanager="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager" ]]; then
            echo "No sdkmanager under $ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          # Accept only the licenses requested by these explicit pinned packages. Do not run the
          # global --licenses command, which could acknowledge unrelated SDK terms on the runner.
          printf 'y\n' | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "$ANDROID_PLATFORM_PACKAGE" "$ANDROID_BUILD_TOOLS_PACKAGE" "$ANDROID_NDK_PACKAGE"
          dirname "$sdkmanager" >> "$GITHUB_PATH"

      - name: Verify pinned native source and race safety
        working-directory: native/traffic-shaping
        run: |
          go mod download
          go mod verify
          go vet ./...
          go test -race -count=1 ./...

      - name: Test, lint, and build
        run: >-
          ./gradlew --no-daemon
          test testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Produce a Kotlin encrypted bundle for cross-language replay
        run: >-
          ./gradlew --no-daemon
          :core:export:test
          --tests cool.jacoblin.particeps.core.export.ResearchExportTest.kotlinExporterWritesEncryptedPythonInteropFixtureWhenExplicitlyRequested

      - name: Set up locked Python analysis environment
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          python-version: "3.13"
          working-directory: particeps-analysis
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Replay the Kotlin ciphertext through Python
        working-directory: particeps-analysis
        run: |
          uv sync --locked
          uv run --frozen python -m unittest discover -s tests -p test_bundle_contract.py -v

      - name: Consume shared Protocol v1 vectors in Kotlin
        run: >-
          ./gradlew --no-daemon
          -I tools/protocol-conformance.init.gradle
          :core:export:test
          --tests particeps.conformance.ProtocolConformanceTest
          --tests particeps.conformance.AutomationReducerConformanceTest

      - name: Enforce collector capability boundary
        run: python3 tools/collector_assurance.py

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: particeps-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented:
    name: Instrumented tests (${{ matrix.name }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API 34
            system_image_api: 34
            target: google_apis
            require_16k: false
            emulator_options: "-no-window -gpu swiftshader -feature -Vulkan -feature -GLDirectMem -no-snapshot -noaudio -no-boot-anim -camera-back none"
          - name: API 37 16 KiB
            system_image_api: "37.0"
            target: google_apis_ps16k
            require_16k: true
            # Keep the renderer minimal; the pre-launch guard separately disables
            # the emulator-only UI readback paths that are broken in revision 5.
            emulator_options: "-no-window -gpu off -writable-system -no-snapshot -noaudio -no-boot-anim -camera-back none"
    env:
      ANDROID_NDK_PACKAGE: ndk;30.0.14904198
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ""
      GONOPROXY: ""
      GONOSUMDB: ""
      GOVCS: "*:off"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.3"
          cache-dependency-path: native/traffic-shaping/go.sum

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager=""
          for candidate in "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
                           "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
                           "$ANDROID_SDK_ROOT"/tools/bin/sdkmanager; do
            if [[ -x "$candidate" ]]; then
              sdkmanager="$candidate"
              break
            fi
          done
          test -n "$sdkmanager"
          printf 'y\n' | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "$ANDROID_NDK_PACKAGE"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run blocking connected test matrix
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0"
          system-image-api-level: ${{ matrix.system_image_api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disk-size: 12G
          emulator-options: ${{ matrix.emulator_options }}
          disable-animations: true
          pre-emulator-launch-script: tools/android-emulator-prebuild.sh --require-16k=${{ matrix.require_16k }}
          script: tools/android-emulator-ci.sh --require-16k=${{ matrix.require_16k }}

      - name: Upload sanitized Android host-harness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-host-harness-${{ matrix.system_image_api }}-${{ matrix.target }}-${{ github.sha }}
          path: build/reports/android-host-harness
          if-no-files-found: error
          retention-days: 14
